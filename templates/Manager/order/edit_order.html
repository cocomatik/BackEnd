{% load static %}
<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <title>Order Management</title>
    <link rel="stylesheet" href="{% static 'Manager/order/css/edit_order.css' %}">
    <script src="https://unpkg.com/htmx.org@2.0.4"></script>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" />

</head>

<body>
    <div class="main">
        <nav class="navbar">
            <a class="logo" href="{% url 'dashboard' %}">
                <img src="{% static 'Manager/images/logo.png' %}" alt="Admin Logo" />
            </a>
            <ul class="nav-links">
                <li><a href="{% url 'dashboard' %}">Dashboard</a></li>
                <li class="dropdown">
                    <a href="#">Products <i class="fas fa-caret-down"></i></a>
                    <ul class="dropdown-menu">
                        <li><a href="{% url 'products' %}?type=cosmetic"><i class="fas fa-spa"></i> Cosmetic</a></li>
                        <li><a href="{% url 'products' %}?type=jewellery"><i class="fas fa-gem"></i> Jewellery</a></li>
                    </ul>
                </li>
                <li><a href="{% url 'best_of_products' %}">Best Items</a></li>
                <li><a href="{% url 'order_list' %}">Orders</a></li>
                <li><a href="{% url 'customer_list' %}">Customers</a></li>
                <li><a href="{% url 'shipment_details' %}">Shipments</a></li>
            </ul>
        </nav>
        <div class="container">
        <h2 class="page-title"><b>Edit Order</b></h2>

        
            <form method="POST" action="{% url 'edit_order' order.id %}">
                {% csrf_token %}

                <div class="form-group">
                    <label for="user">User:</label>
                    <input type="text" id="user" name="user" value="{{ order.user }}" disabled>
                </div>

                <div class="form-group">
                    <label for="cart">Cart ID:</label>
                    <input type="text" id="cart" name="cart" value="{{ order.cart.id }}" disabled>
                </div>

                <div class="form-group">
                    <label for="payment_mode">Payment Mode:</label>
                    <select id="payment_mode" name="payment_mode">
                        <option value="paymentgateway" {% if order.payment_mode == 'paymentgateway' %}selected{% endif %}>
                            Payment Gateway</option>
                        <option value="cashondelivery" {% if order.payment_mode == 'cashondelivery' %}selected{% endif %}>
                            Cash On Delivery</option>
                    </select>
                </div>

                <div class="form-group">
                    <label for="address">Address:</label>
                    <select id="address" name="address">
                        {% for addr in addresses %}
                        <option value="{{ addr.id }}" {% if order.address.id == addr.id %}selected{% endif %}>
                            {{ addr }}
                        </option>
                        {% endfor %}
                    </select>
                </div>

                <div class="btn-group">
                    <button type="submit" class="btn save-btn">Save Changes</button>
                    <a href="{% url 'order_list' %}" class="btn cancel-btn">Cancel</a>
                </div>
            </form>
        </div>
    </div>

    <!-- Mobile Message -->
    <div class="message-container">
        <div class="icon">🚫</div>
        <h1>Access Restricted</h1>
        <p>This page is only accessible on a desktop. Please visit from a PC.</p>
    </div>
</body>

</html>
