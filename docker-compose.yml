services:
  db:
    image: postgres:17
    restart: unless-stopped
    env_file:
      - ./.env.prod
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 10s
      timeout: 5s
      retries: 10
    ports:
      - "5432:5432"

  django-web:
    build: .
    container_name: coco-bckd
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    env_file:
      - ./.env.prod
    volumes:
      - staticfiles:/COCOB/staticfiles
      - mediafiles:/COCOB/media

  frontend-proxy:
    image: nginx:latest
    restart: unless-stopped
    depends_on:
      - django-web
    ports:
      - "8001:80"
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf:ro
      - staticfiles:/static:ro
      - mediafiles:/media:ro

volumes:
  postgres_data:
  staticfiles:
  mediafiles:
